# Generate the Xcode project:  brew install xcodegen && xcodegen
name: Jur
options:
  bundleIdPrefix: kz.jur
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: $(JUR_TEAM_ID)
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
targets:
  Jur:
    type: application
    platform: iOS
    sources:
      - path: Jur
      - path: Shared
    dependencies:
      - target: JurWidgets
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.jur.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Jur/Info.plist
      properties:
        CFBundleDisplayName: JÜR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru, kk]
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBlue
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts:
          - Unbounded-Bold.ttf
          - Unbounded-ExtraBold.ttf
          - Manrope-Regular.ttf
          - Manrope-Medium.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        NSCameraUsageDescription: Take your verification selfie and photos for your profile.
        NSPhotoLibraryUsageDescription: Choose photos for your profile and chats.
        NSMicrophoneUsageDescription: Record voice messages in chats.
        JurSupabaseHost: $(SUPABASE_HOST)
        JurSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        JurRevenueCatKey: $(REVENUECAT_IOS_KEY)
        JurSiteHost: $(SITE_HOST)
        JurSupportEmail: $(SUPPORT_EMAIL)
        JurEvents: $(JUR_EVENTS)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: kz.jur.app
            CFBundleURLSchemes: [jur]
    entitlements:
      path: Jur/Jur.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.sensitivecontentanalysis.client: [analysis]
        aps-environment: development
        com.apple.security.application-groups: [group.kz.jur.app]
  # The departure countdown (Live Activity) on the lock screen and in the Dynamic Island.
  JurWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JurWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.jur.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
    info:
      path: JurWidgets/Info.plist
      properties:
        CFBundleDisplayName: JÜR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
